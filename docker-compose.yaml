name: automation-portal

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: automation-portal:latest
    container_name: automation-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    # DATABASE_URL, JWT_SECRET, GITHUB_* dibaca dari .env (lihat .env.example).
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # PostgreSQL lokal opsional — TIDAK jalan secara default.
  # Pakai bila tidak ingin Supabase/Neon:
  #   docker compose --profile local-db up -d
  # lalu set di .env:
  #   DATABASE_URL=postgresql://postgres:postgres@db:5432/automation_portal
  #   PGSSLMODE=disable
  db:
    image: postgres:16-alpine
    container_name: automation-portal-db
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automation_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
